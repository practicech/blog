<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="naver-site-verification" content="8c234994bf44d54fd78129b9dbce9b02b9a1e981" />
    <meta name="google-site-verification" content="JcK60q4baHWu4df5kzaYTouU6ecq0m9rH7AbHm-pu7A" />
    <!-- 024: 그리기 전에 테마를 정한다(외부 파일, defer 없음) -->
    <script th:src="@{/js/theme-init.js}"></script>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_parameter" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:replace="${title}">글그린</title>
    <!-- 탭 아이콘: 발바닥 로고(svg), 옛 브라우저는 32px png, iOS 홈 화면은 180px. /images/ 아래라 지문·1년 보관 -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
    <th:block th:if="${pageMeta != null}">
        <meta name="description" th:content="${pageMeta.description()}">
        <link rel="canonical" th:href="${pageMeta.canonicalUrl()}">
        <meta property="og:type" content="article">
        <meta property="og:title" th:content="${pageMeta.title()}">
        <meta property="og:description" th:content="${pageMeta.description()}">
        <meta property="og:url" th:content="${pageMeta.canonicalUrl()}">
        <meta property="og:image" th:content="${pageMeta.imageUrl()}">
        <meta property="article:published_time" th:content="${pageMeta.publishedTime()}">
        <meta property="article:modified_time" th:if="${pageMeta.modifiedTime() != null}" th:content="${pageMeta.modifiedTime()}">
    </th:block>
    <meta name="robots" content="noindex" th:if="${pageNoindex != null and pageNoindex}">
    <!-- 글 화면(pageMeta)·볼 수 없는 글(notFoundPage)·검색 제외 화면(pageNoindex, 예: 비공개 글)이 아닌 화면의 기본 SEO 메타 -->
    <th:block th:if="${pageMeta == null and (notFoundPage == null or !notFoundPage) and (pageNoindex == null or !pageNoindex)}">
        <meta name="description" content="하루 한 편, 잔디처럼 자라는 글. 글그린에서 일상과 개발, 그리고 생각을 매일 한 칸씩 채워요">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="글그린">
        <meta property="og:title" content="글그린">
        <meta property="og:description" content="하루 한 편, 잔디처럼 자라는 글. 글그린에서 일상과 개발, 그리고 생각을 매일 한 칸씩 채워요">
        <th:block th:if="${siteOrigin != null and !siteOrigin.isEmpty() and currentPath != null and !currentPath.startsWith('/error')}">
            <link rel="canonical" th:href="${siteOrigin + canonicalPath}">
            <meta property="og:url" th:content="${siteOrigin + canonicalPath}">
            <meta property="og:image" th:content="${siteOrigin + '/images/og-default.png'}">
        </th:block>
    </th:block>
    <th:block th:if="${notFoundPage != null and notFoundPage}">
        <meta property="og:title" content="볼 수 없는 글이에요">
        <meta property="og:description" content="친구 공개·비공개 글이거나 삭제된 글입니다.">
        <meta name="robots" content="noindex">
    </th:block>
    <link rel="stylesheet" href="/fonts/pretendard/pretendard.css">
    <link rel="stylesheet" href="/fonts/gaegu/gaegu.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand" aria-label="글그린 처음으로"><th:block th:replace="~{fragments/icons :: jandi}"></th:block><span>글그린</span></a>
    <nav class="site-nav" aria-label="주요 메뉴">
        <!-- 좁은 화면에서는 ☰ 안으로 접힌다(스크립트가 없으면 지금처럼 모두 펼친다) -->
        <div id="site-menu" class="site-menu">
            <div class="menu-main">
                <a href="/" th:attr="aria-current=${currentPath == '/' ? 'page' : null}">홈</a>
                <!-- 079 강성찬 개인 확장: 탐색(추천 글·블로그·인기 태그, 휴대폰에서도 닿게) -->
                <a href="/explore" th:attr="aria-current=${currentPath == '/explore' ? 'page' : null}">탐색</a>
                <a href="/tags" th:attr="aria-current=${currentPath != null and currentPath.startsWith('/tags') ? 'page' : null}">태그</a>
                <!-- 067 후속(강성찬 개인 확장): 내 글·설정은 오른쪽 위 프로필 메뉴에만(겹침 정리). 10-15 chan: 피드를 미션 앞으로 -->
                <a href="/feed" th:if="${currentMemberId != null}" th:attr="aria-current=${currentPath == '/feed' ? 'page' : null}">피드</a>
                <a href="/missions" th:if="${missionsEnabled != null and missionsEnabled}"
                   th:attr="aria-current=${currentPath != null and currentPath.startsWith('/missions') ? 'page' : null}">미션</a>
                <th:block th:if="${currentMemberId != null}">
                    <a href="/admin" th:if="${currentIsAdmin}" th:attr="aria-current=${currentPath != null and currentPath.startsWith('/admin') ? 'page' : null}">관리</a>
                </th:block>
            </div>
            <div class="menu-account">
                <th:block th:if="${currentMemberId != null}">
                    <form method="post" action="/write">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-primary btn-sm btn-write"><th:block th:replace="~{fragments/icons :: pen}"></th:block>새 글</button>
                    </form>
                </th:block>
                <th:block th:unless="${currentMemberId != null}">
                    <a href="/login" class="menu-login">로그인</a>
                    <a href="/signup" class="btn btn-primary btn-sm">가입하기</a>
                </th:block>
            </div>
            <!-- 067 후속(강성찬 개인 확장): 좁은 화면 ☰ 메뉴 안 사이트 링크(목록이 끝없이 이어져 꼬리말에 닿기 어려움, 비회원도) -->
            <div class="menu-links">
                <a href="/terms">이용약관</a> <a href="https://github.com/AIPKANG" class="github-link" target="_blank" rel="noopener"><th:block th:replace="~{fragments/icons :: github}"></th:block>GitHub</a> <a href="/privacy">개인정보 처리방침</a> <a href="/releases">릴리스 노트</a>
                <a th:if="${contactPage == true}" href="/contact">문의하기</a><a th:if="${contactPage != true and contactEmail != null}" th:href="${'mailto:' + contactEmail}">문의하기</a>
            </div>
        </div>
        <!-- 항상 보이는 것: 검색, 알림 종, 좁은 화면의 메뉴 버튼(테마 전환은 061부터 설정 화면에) -->
        <span class="header-quick">
            <!-- 078 강성찬 개인 확장: 검색은 이 자리에서 입력창+추천 태그로 열린다(스크립트 없이 details, 태그 메뉴 대신) -->
            <details class="search-menu">
                <summary class="icon-btn" aria-label="검색"><th:block th:replace="~{fragments/icons :: search}"></th:block></summary>
                <div class="search-menu-panel">
                    <form method="get" action="/search" role="search" class="search-form">
                        <label for="header-search-q" class="visually-hidden">검색어</label>
                        <input id="header-search-q" type="search" name="q" maxlength="50" placeholder="검색어를 입력하세요">
                        <button type="submit" class="btn btn-primary btn-sm">검색</button>
                    </form>
                    <th:block th:if="${headerTags != null and !headerTags.isEmpty()}">
                        <p class="search-menu-title">추천 태그</p>
                        <ul class="search-menu-tags">
                            <li th:each="t : ${headerTags}"><a th:replace="~{fragments/tag-pill :: pill(${t.name()}, ${t.postCount()}, null)}"></a></li>
                        </ul>
                    </th:block>
                    <a href="/tags" class="link-btn search-menu-all">태그 전체 보기</a>
                </div>
            </details>
            <!-- 화면 모드 한 번에 바꾸기(라이트↔다크). 누르기 전엔 기기 설정, 누르면 설정의 "화면 테마"와 같은 곳에 저장. 스크립트가 없으면 숨김 -->
            <button type="button" id="theme-switch" class="icon-btn theme-switch" hidden aria-label="다크 모드로 바꾸기">
                <th:block th:replace="~{fragments/icons :: moon}"></th:block><th:block th:replace="~{fragments/icons :: sun}"></th:block></button>
            <span class="notif-bell-wrap" th:if="${currentMemberId != null}">
                <a href="/notifications" id="notif-bell" class="notif-bell" aria-label="알림"
                   aria-haspopup="true" aria-expanded="false"><th:block th:replace="~{fragments/icons :: bell}"></th:block><span id="notif-badge" class="notif-badge" hidden></span></a>
                <div id="notif-panel" class="notif-panel" hidden></div>
            </span>
            <!-- 홈 리뉴얼(강성찬 개인 확장): 내 프로필 메뉴(스크립트 없이 details) -->
            <details class="profile-menu" th:if="${currentMemberId != null}">
                <summary aria-label="내 메뉴">
                    <th:block th:if="${currentAvatar != null}"><th:block th:replace="~{fragments/avatar :: avatar(${currentAvatar}, 32)}"></th:block></th:block>
                    <span th:if="${currentAvatar == null}" class="avatar avatar-default" aria-hidden="true">나</span>
                </summary>
                <div class="profile-menu-panel">
                    <a th:if="${currentAvatar != null}" th:href="${paths.blog(currentAvatar.handle())}" th:text="${currentAvatar.handle() + '의 블로그'}">내 블로그</a>
                    <a href="/manage/posts">내 글 관리</a>
                    <a href="/manage/stats">통계</a>
                    <a href="/settings">설정</a>
                    <form method="post" action="/logout" data-logout-form th:attr="data-member-id=${currentMemberId}">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-text">로그아웃</button>
                    </form>
                </div>
            </details>
            <button type="button" id="menu-toggle" class="menu-toggle" hidden aria-expanded="false" aria-controls="site-menu"
                    aria-label="메뉴 열기">☰</button>
        </span>
    </nav>
  </div>
</header>
<!-- 049 강성찬 개인 확장: 사이트 공지 띠 -->
<div th:if="${siteNotice != null}" class="site-notice" role="status">
    <span th:text="${'📢 ' + siteNotice.message()}">공지</span>
    <a th:if="${siteNotice.linkUrl() != null}" th:href="${siteNotice.linkUrl()}">자세히</a>
</div>
<div hidden id="logout-cleanup" th:if="${logoutCleanupMemberId != null}" th:attr="data-member-id=${logoutCleanupMemberId}"></div>
<p th:if="${successMessage != null}" class="notice" role="status" data-toast="success" th:text="${successMessage}">완료</p>
<main th:replace="${content}">
</main>
<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-brand"><th:block th:replace="~{fragments/icons :: jandi}"></th:block><span>글그린</span></p>
    <p class="footer-slogan">하루 한 편, 잔디처럼 자라는 글</p>
    <p class="footer-links"><a href="/terms">이용약관</a> <a href="https://github.com/AIPKANG" class="github-link" target="_blank" rel="noopener"><th:block th:replace="~{fragments/icons :: github}"></th:block>GitHub</a> <a href="/privacy">개인정보 처리방침</a> <a href="/releases">릴리스 노트</a>
        <a th:if="${contactPage == true}" href="/contact">문의하기</a><a th:if="${contactPage != true and contactEmail != null}" th:href="${'mailto:' + contactEmail}">문의하기</a></p>
  </div>
</footer>
<script th:src="@{/js/auth/auth-logout.js}" defer></script>
<script th:src="@{/js/menu.js}" defer></script>
<script th:src="@{/js/keep-scroll.js}" defer></script>
<script th:src="@{/js/toast.js}" defer></script>
<script th:src="@{/js/theme-switch.js}" defer></script>
<script th:src="@{/js/post/card-rows.js}" defer></script>
<script th:if="${currentMemberId != null}" th:src="@{/js/notification/bell.js}" defer></script>
<script th:if="${currentMemberId != null}" th:src="@{/js/post/liked-hearts.js}" defer></script>
</body>
</html>
