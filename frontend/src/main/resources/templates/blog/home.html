<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${owner.handle() + ' · 글그린'}">블로그</title>
</head>
<body>
<main class="list-page">
    <th:block th:replace="~{fragments/blog-header :: header}"></th:block>
    <!-- 054 강성찬 개인 확장: 고정 글 -->
    <section th:if="${pinnedCard != null}" class="pinned-post shelf" aria-label="고정 글">
        <p class="pinned-label"><svg th:replace="~{fragments/icons :: pin}"></svg> 고정 글</p>
        <div class="card-grid pinned-grid">
            <article th:replace="~{fragments/post-card :: card(${pinnedCard}, ${pinnedDate}, false)}"></article>
        </div>
    </section>
    <!-- 031 강성찬 개인 확장: 잔디·스트릭(최근 1년, 공개 글·공개 글 댓글만) -->
    <section th:if="${grass != null}" class="grass" aria-labelledby="grass-heading">
        <h2 id="grass-heading" class="grass-title">글 잔디
            <span class="grass-streak" th:if="${grass.currentStreak() > 0}"><svg th:replace="~{fragments/icons :: jandi-line}"></svg> <th:block th:text="${grass.currentStreak() + '일 연속'}">3일 연속</th:block></span>
            <span class="help" th:text="${'최근 1년 ' + grass.activeDays() + '일 · 최고 ' + grass.bestStreak() + '일 연속'}">최근 1년</span></h2>
        <div class="grass-grid" role="img" th:attr="aria-label=${'최근 1년 동안 ' + grass.activeDays() + '일 기록, 최고 ' + grass.bestStreak() + '일 연속'}">
            <div class="grass-week" th:each="w : ${grass.weeks()}">
                <span th:each="d : ${w}" th:class="${'grass-day grass-' + d.level() + (d.mission() ? ' grass-mission' : '')}" th:title="${d.label()}"></span>
            </div>
        </div>
    </section>
    <!-- 033 강성찬 개인 확장: 짧은 기록 -->
    <section th:if="${recentNotes != null and (!recentNotes.isEmpty() or isOwner)}" class="notes-box" aria-labelledby="notes-heading">
        <h2 id="notes-heading" class="grass-title">짧은 기록 <a class="link-btn" th:href="${paths.blog(owner.handle()) + '/notes'}">모두 보기</a></h2>
        <th:block th:if="${isOwner}"><form th:replace="~{fragments/note :: noteForm(${paths.blog(owner.handle())})}"></form></th:block>
        <ul class="note-list" th:unless="${recentNotes.isEmpty()}">
            <th:block th:each="n : ${recentNotes}"><li th:replace="~{fragments/note :: item(${n}, ${noteDates.get(n.id())}, ${paths.blog(owner.handle())})}"></li></th:block>
        </ul>
    </section>
    <!-- 100 강성찬 개인 확장: 최근 글 선반(비면 숨김, 주인에게는 첫 글 안내) -->
    <section th:unless="${cards.isEmpty()}" class="shelf" aria-labelledby="shelf-posts">
        <h2 th:replace="~{fragments/blog-header :: shelfHead('shelf-posts', '최근 글', ${paths.blog(owner.handle()) + '/posts'})}">최근 글</h2>
        <div class="card-grid home-cards">
            <th:block th:each="card : ${cards}">
                <article th:replace="~{fragments/post-card :: card(${card}, ${cardDates.get(card.id())}, false)}"></article>
            </th:block>
        </div>
    </section>
    <th:block th:if="${cards.isEmpty() and pinnedCard == null}">
        <p class="empty-state" th:unless="${isOwner}">아직 공개한 글이 없어요</p>
        <div class="empty-state" th:if="${isOwner}">첫 글을 써 보세요
            <form method="post" action="/write" class="inline-form">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">글쓰기</button>
            </form>
        </div>
    </th:block>
    <!-- 100: 시리즈 선반(공개 글이 있는 시리즈만, 비면 숨김) -->
    <section th:if="${homeSeries != null and !homeSeries.isEmpty()}" class="shelf" aria-labelledby="shelf-series">
        <h2 th:replace="~{fragments/blog-header :: shelfHead('shelf-series', '시리즈', ${paths.blog(owner.handle()) + '/series'})}">시리즈</h2>
        <ul th:replace="~{series/list :: seriesCards(${homeSeries})}"></ul>
    </section>
    <script th:src="@{/js/follow/follow.js}" defer></script>
</main>
</body>
</html>
